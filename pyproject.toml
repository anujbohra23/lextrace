[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "lextrace"
version = "0.1.0"
description = "Research foundations for authority-aware U.S. case law retrieval."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "numpy>=2.1,<3"]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=5,<6"]
research = ["langgraph>=1.2,<2", "openai>=3.11,<4"]
dev = [
    "mypy>=1.15,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff==0.11.13",
]

[project.scripts]
lextrace = "lextrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lextrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

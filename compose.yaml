services:
  backend:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LEXTRACE_LLM_MODEL: ${LEXTRACE_LLM_MODEL:-}
      LEXTRACE_INDEX_PATH: /app/artifacts/indexes/default
      LEXTRACE_GRAPH_PATH: /app/artifacts/graphs/default
      LEXTRACE_RUNTIME_DB: /app/runtime/lextrace.sqlite3
      LEXTRACE_CACHE_DB: /app/runtime/cache.sqlite3
      LEXTRACE_MATTER_DB: /app/runtime/matters.sqlite3
      LEXTRACE_PRIVATE_MATTER_ROOT: /app/runtime/private_matters
      LEXTRACE_CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
      - lextrace-runtime:/app/runtime
      - lextrace-models:/home/lextrace/.cache
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_LEXTRACE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports: ["3000:3000"]
volumes:
  lextrace-runtime:
  lextrace-models:
